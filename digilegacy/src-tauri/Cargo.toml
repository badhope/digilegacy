[package]
name = "digilegacy"
version = "0.6.0"
description = "DigiLegacy - local-first digital legacy planning desktop app"
authors = ["DigiLegacy Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/badhope/digilegacy"
readme = "../../README.md"

# 仓库里有两个 bin（主应用 + digilegacy-mcp MCP 服务器）。
# 不指定 default-run，tauri build 会报 "failed to find main binary"。
default-run = "digilegacy"

[lib]
name = "digilegacy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-autostart = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SQLCipher 整库加密（P2-1）。
#
# 用 `bundled-sqlcipher-vendored-openssl`：OpenSSL 随 crate 一起在本机编译，构建
# 环境**不需要**预装 OpenSSL，也不需要用 OPENSSL_DIR / OPENSSL_LIB_DIR 指路。
#
# 早期用的是 `bundled-sqlcipher`（外部 OpenSSL），代价是每个构建环境都得自己准备
# 一份静态 OpenSSL：CI 的 windows-latest 上没配，于是 `libsqlite3-sys` 的 build
# script 直接 panic，安装包在本地能出、在 CI 出不了。这类「本地绿、用户装不上」
# 的失败代价最高，所以宁可多花一点编译时间也要把前置条件消掉。
#
# 该路径需要 perl（Strawberry Perl）与 nasm：CI 的 windows-latest 已预装，
# 本机准备步骤见 docs/VERIFICATION.md。
#
# 明文库兼容：SQLCipher 无 key 时以普通 SQLite 语义工作，测试与未升级用户不受影响。
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
thiserror = "1.0"
aes-gcm = "0.11"
rand = "0.9"
base64 = "0.23"
once_cell = "1.20"
pbkdf2 = { version = "0.13", features = ["hmac"] }
sha2 = "0.11"
zeroize = "1.8"
# sharks 0.5.0 有 RUSTSEC-2024-0398（多项式系数偏置，无上游修复）；
# blahaj 是其官方认可的修复分叉，API 兼容。0.6.0 即修复版。
blahaj = "0.7"
argon2 = "0.6.0"
lettre = { version = "0.11.23", features = ["smtp-transport", "rustls-tls", "builder"] }
ureq = { version = "3.5.0", features = ["rustls", "json"] }
tauri-plugin-single-instance = "2.5.5"
data-encoding = "2.11.1"
keepass = { version = "0.17.0", features = ["save_kdbx4"] }
hkdf = "0.13.0"
imap = { version = "2.4.1", features = ["native-tls"] }
native-tls = "0.2.18"
# CLI 与 HTTP 服务入口。
# clap：命令行解析（derive 模式，与 Tauri 无耦合）。
# axum/tokio：Web 端只读 API。tokio 已由 tauri 传递引入，这里显式声明
# 我们实际用到的 features，避免依赖上游 feature 集合的偶然性。
clap = { version = "4.5", features = ["derive"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# 本机 Windows + rustc 1.99 编译 windows 0.62.2 时，默认 opt-level=3 会让 rustc
# 自身以 STATUS_STACK_BUFFER_OVERRUN 崩溃（与业务代码无关）。opt-level=1 +
# codegen-units=16 + debug=0 实测可稳定完成 release 构建；桌面 CRUD 应用性能足够。
[profile.release]
opt-level = 1
codegen-units = 16
debug = 0
lto = false
incremental = false

# 整库加密的 key 管理：Windows DPAPI（CryptProtectData/Unprotect）。
# 与 Tauri 共用同一个 windows crate（feature 取并集），不新增编译单元。
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }
