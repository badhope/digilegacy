[workspace]
resolver = "2"
members = [
  "core/foundation",
  "core/contracts",
  "core/security",
  "core/store",
  "core/domains",
  "core/integrations",
  "core/agent",
  "core/render",
  "apps/server",
  "apps/cli",
  "apps/mcp",
  "apps/desktop",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
