[workspace]
resolver = "2"
members = [
  "core/foundation",
  "core/contracts",
  "core/security",
  "core/store",
  "core/domains",
    "core/application",
  "core/integrations",
  "core/agent",
  "core/render",
  "apps/server",
  "apps/cli",
  "apps/mcp",
]

[workspace.package]
version = "0.0.13"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.11"
argon2 = "0.6.0"
base64 = "0.23"
pbkdf2 = { version = "0.13", features = ["hmac"] }
sha2 = "0.11"
zeroize = "1.8"
rand = "0.9"
hkdf = "0.13.0"
hmac = "0.13.0"
once_cell = "1.20"
blahaj = "0.6"
data-encoding = "2.11"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
