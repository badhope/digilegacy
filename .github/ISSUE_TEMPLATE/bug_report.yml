name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).

        Before filing, please search existing issues. Redact any real account identifiers, phone numbers, or credentials from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the sidebar footer, or the installer filename.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Installed NSIS package
        - Installed MSI package
        - Built from source (tauri:dev)
        - Browser preview (npm run dev)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Profile
        2. Set a master password with an existing profile filled in
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact error text. If the app crashed, say whether the window closed or only the page went blank.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact personal data first.
    validations:
      required: false
