name: Feature / RFC
description: Propose a capability or an open design decision
title: "[rfc] "
labels: ["rfc"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful shape of the change.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Contract / data / permission impact
      description: New commands, schemas, write access, migrations or Agent tools.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
