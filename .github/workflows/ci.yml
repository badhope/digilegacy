name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧运行，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 · typecheck / test+coverage / build
    # 镜像仓库（x33834 / Morningstar202604 / Gitee / GitCode）保留同一份工作流，
    # 但只在 canonical 仓库执行，避免镜像账号消耗 Actions 额度。
    if: github.repository == 'badhope/digilegacy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: digilegacy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 依赖链要求 ^22.22.2 || ^24.15.0 || >=26；22 线在 Actions 上会解析到最新 22.x，
          # 本地实测 24.14.0 反而不满足，故固定 22 线（LTS + 满足 engines）。
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: digilegacy/package-lock.json

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 类型检查
        run: npx vue-tsc --noEmit

      - name: 单元测试 + 覆盖率门禁
        run: npm run test:coverage

      - name: 生产构建
        run: npm run build

      - name: 演示构建（VITE_DEMO=1，静态站）
        run: npm run build:demo

      # 生产包必须不含演示后端：设为 true 时重新构建并断言无 mock 分块。
      # 注意：上一步 build:demo 的输出会覆盖 dist，因此这条断言之前必须再 build 一次。
      - name: 生产包必须不含演示后端
        # mock.ts 只在 DEV / DEMO 构建里可达；这条断言防止一次 import 改动
        # 把整个演示 mock（含 localStorage 明文逻辑）悄悄塞进安装包。
        run: |
          npm run build
          if ls dist/assets | grep -q '^mock-'; then
            echo "::error::生产构建包含 mock 分块，演示后端泄漏进安装包"
            ls dist/assets | grep '^mock-'
            exit 1
          fi

      - name: 文档数字与源码一致性
        # 测试数/命令数/平台数这类手抄数字历史上漂移过多次；
        # 这里从源码重新推导后与 README/官网/架构文档比对，不一致直接红。
        run: node scripts/check-doc-facts.mjs

      - name: 政策库溯源门禁
        # 内容型产品的信任来自可追溯：每条政策必须有真实出处或显式「未核实」，
        # 且未核实条目数只能减少不能增加（棘轮）。绝不自动补写出处或核对日期。
        run: node scripts/check-policy-provenance.mjs

      - name: 权威来源核验
        # 外部链接会腐烂。这里实测每个来源的 HTTP 状态与页面内容，
        # 区分「可达」与「内容匹配」两件不同的事实。
        # 只在 allow-failure 模式下跑：政务站点偶发超时不应阻塞构建。
        continue-on-error: true
        run: node scripts/verify-authorities.mjs

      - name: 依赖漏洞扫描（npm）
        # 默认镜像的 audit 端点常不可用，显式指向官方 registry
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  e2e:
    name: E2E · Playwright（路由矩阵 + 场景矩阵 + 交互链路）
    if: github.repository == 'badhope/digilegacy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: digilegacy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: digilegacy/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        # GitHub runner 的 CDN 速度正常；显式给足超时，避免大包下载被默认阈值截断
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E
        run: npx playwright test

      - name: E2E 覆盖率（不阻断，仅报告）
        # 与单元覆盖率是两套口径：前者证明「用户点到的路径都跑过」，
        # 后者证明「分支组合被覆盖」。这里只产出报告，不设阈值。
        run: |
          rm -rf e2e/.coverage
          E2E_COVERAGE=1 npx playwright test
          node e2e/collect-coverage.mjs
        continue-on-error: true

      - name: 上传 E2E 覆盖率
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage
          path: digilegacy/coverage-e2e/
          retention-days: 7

      - name: 上传失败痕迹
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: digilegacy/playwright-report/
          retention-days: 7

  rust:
    name: Rust · fmt / clippy / test
    if: github.repository == 'badhope/digilegacy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: digilegacy/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: digilegacy/src-tauri

      - name: 安装 Tauri v2 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy（警告即失败）
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test --locked

      - name: 依赖漏洞扫描（RustSec）
        # cargo-audit 0.22 的 --deny 只接受 warnings/unmaintained/unsound/yanked，
        # 不接受 `vulnerabilities`（旧写法直接以 “invalid value” 失败，
        # CI 曾连续两次红在这一步，与真实漏洞无关）。默认行为即：
        # 发现漏洞 → exit 1；unmaintained/unsound 仅告警。
        #
        # 这里显式钉版本并 *不使用* `|| true`：旧写法会吞掉安装失败，
        # 然后用 runner 上残留的旧版 cargo-audit 扫描（甚至扫不到），
        # 属于典型的假绿灯。安装失败就该让 job 红。
        run: |
          cargo install cargo-audit --version 0.22.1 --locked --quiet
          cargo audit --version
          cargo audit

  heartbeat-server:
    name: 心跳服务器 · 语法与行为
    if: github.repository == 'badhope/digilegacy'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: digilegacy/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'

      - name: 语法检查
        run: node --check heartbeat-server.mjs

      - name: 行为测试（鉴权 / 未注册令牌 / 413 / 健康探针）
        run: node heartbeat-server.test.mjs

  # 发布构建：验证安装包真的能产出。
  # 这条曾经缺失，导致「MSI 因中文产品名 + WiX codepage 1252 打包失败」
  # 一直没被发现——代码全绿但用户根本装不上。
  release-build:
    name: 发布构建 · Windows 安装包
    if: github.repository == 'badhope/digilegacy'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: digilegacy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: digilegacy/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: digilegacy/src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建安装包（MSI + NSIS）
        run: npm run tauri:build

      - name: 断言产物存在
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          if (-not $msi) { throw 'MSI 未生成' }
          if (-not $nsis) { throw 'NSIS 安装包未生成' }
          Write-Host "MSI: $($msi.Name) ($([math]::Round($msi.Length/1MB,2)) MB)"
          Write-Host "NSIS: $($nsis.Name) ($([math]::Round($nsis.Length/1MB,2)) MB)"

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            digilegacy/src-tauri/target/release/bundle/msi/*.msi
            digilegacy/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
