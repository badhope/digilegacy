name: Release

# 发布构建：推送 v* 标签时构建 Windows 安装包并创建 GitHub Release。
# 与 ci.yml 的 release-build job 互补——CI 只验证「能产出」，这里负责「真的发布」。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 构建并发布 Windows 安装包
    if: github.repository == 'badhope/digilegacy'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: digilegacy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: digilegacy/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: digilegacy/src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 版本号一致性检查
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
          if ($pkg -ne $tauri -or $pkg -ne $cargo) {
            throw "版本号不一致: package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          }
          Write-Host "版本号一致: $pkg"

      - name: 构建安装包
        run: npm run tauri:build

      - name: 生成校验和
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe
          if (-not $files) { throw '未生成任何安装包' }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # 必须写 LF + 无 BOM：Linux 侧的 `sha256sum -c` 会把 CR 当成文件名的一部分。
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'digest-sha256.txt'),
            (($lines -join "`n") + "`n"),
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content digest-sha256.txt

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # 直接发布而不是草稿：草稿对 verify-release 不可见（gh release download
          # 默认只在已发布版本里找），会造成「构建成功、校验必失败」的假红。
          draft: false
          generate_release_notes: true
          files: |
            digilegacy/src-tauri/target/release/bundle/msi/*.msi
            digilegacy/src-tauri/target/release/bundle/nsis/*.exe
            digilegacy/digest-sha256.txt

  # 发布后校验：确认 Release 里的产物确实能下载、校验和能对上。
  # 发布流程最怕「标签打了、Release 建了、文件却缺失/损坏」——这里用 API 实测。
  verify-release:
    name: 校验 Release 产物
    needs: build-and-release
    if: github.repository == 'badhope/digilegacy'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载并校验 SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Release 刚创建时资产可能还在上传；最多重试 6 次（约 1 分钟）
          for i in $(seq 1 6); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then break; fi
            echo "等待 Release 可见（第 $i 次）…"
            sleep 10
          done
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"' | tee /tmp/assets.tsv
          grep -q '\.msi' /tmp/assets.tsv
          grep -q 'setup\.exe' /tmp/assets.tsv
          grep -q 'digest-sha256' /tmp/assets.tsv
          # 文件名不得以 _ 开头：说明 productName 含非 ASCII 字符时打包器把前缀吞了。
          if grep -qE '^_' /tmp/assets.tsv; then
            echo "::error::安装包文件名以 _ 开头，检查 tauri.conf.json 的 productName"
            exit 1
          fi
          mkdir -p /tmp/rel && cd /tmp/rel
          gh release download "$TAG" --repo "${{ github.repository }}"
          sha256sum -c digest-sha256.txt
          echo "Release $TAG artifacts verified"

